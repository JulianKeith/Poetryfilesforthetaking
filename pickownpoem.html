
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Verse Poetry Engine</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Unkempt:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <style>
        /* =========================
           GLOBAL STYLES

           Setting	Choice text
Ocean	Beneath the waves, where the world turns blue.
Winter	In a snow-covered town that has forgotten time.
Autumn	Along a golden path buried in fallen leaves.
Spring	Inside a garden waking up after a long sleep.
Abandoned	Inside an abandoned house, untouched for decades.
School	In an empty school hallway after the final bell.
Bedroom	Inside a bedroom full of memories and unfinished dreams.
Train	Aboard a train travelling through an unfamiliar landscape.
Rain	Beneath an awning while rain floods the streets.
Sunrise	On a hill as the first light spills across the horizon.
Sunset	On a rooftop watching the sun disappear.
Fog	In a village swallowed by thick, silver fog.
Space	Floating through an endless universe of stars.
Fantasy	Inside a forgotten kingdom where magic still lingers.
Time	In a room where every clock shows a different hour.
Carnival	At an amusement park long after closing time.
Library	In an ancient library where the books whisper.
Mirrors	Inside a hall of mirrors where nothing looks quite right.
Greenhouse	In a glass greenhouse overtaken by wild plants.
Candlelight	In a dark room illuminated by a hundred candles.
        ========================= */

        :root {
            --bg-color: #121214;
            --text-color: #e2e8f0;
            --accent-color: #94a3b8;
            --button-bg: #1e1e24;
            --button-hover: #2d2d39;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Unkempt', cursive;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 20px 40px;
            min-height: 100vh;
        }

        /* =========================
           NAVIGATION BAR
        ========================= */

        .first {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            width: 100%;
            min-height: 80px;
            padding: 10px 25px;
            margin: 0 auto 30px;

            background: linear-gradient(
                110deg,
                #252436 0%,
                #292B46 55%,
                #354C78 100%
            );

            border-radius: 16px;
            box-sizing: border-box;

            transition: background 0.8s ease;
        }

        .logo {
            display: block;
            flex-shrink: 0;
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 50%;
        }

        .first ul {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 12px 20px;

            list-style: none;
            margin: 0 0 0 auto;
            padding: 0;
        }

        .first a {
            display: inline-block;
            color: #F0E6D2;
            font-family: 'Unkempt', cursive;
            font-size: 18px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .first a:hover,
        .first a:focus-visible {
            color: #E4C878;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;

            background: #18181c;
            padding: 40px;

            border-radius: 8px;
            border: 1px solid #27272a;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        h1,
        h2 {
            font-weight: normal;
            color: #fff;
            margin-top: 0;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(26px, 5vw, 36px);
        }

        h2 {
            font-size: clamp(23px, 4vw, 30px);
            line-height: 1.4;
        }

        p {
            line-height: 1.6;
        }

        /* =========================
           SCREENS
        ========================= */

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fade-in 0.4s ease;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           CHOICE GAME BUTTONS
        ========================= */

        .choice-btn {
            display: block;
            width: 100%;

            background-color: var(--button-bg);
            color: var(--text-color);

            border: 1px solid #3f3f46;
            border-radius: 4px;

            padding: 15px;
            margin: 12px 0;

            text-align: left;
            font-family: 'Unkempt', cursive;
            font-size: 17px;
            line-height: 1.5;

            cursor: pointer;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                padding-left 0.2s ease;
        }

        .choice-btn:hover {
            background-color: var(--button-hover);
            border-color: var(--accent-color);
            padding-left: 20px;
        }

        .choice-btn:focus-visible,
        .restart-btn:focus-visible {
            outline: 2px solid #E4C878;
            outline-offset: 3px;
        }

        /* =========================
           WRITING WORKSPACE
        ========================= */

        .workspace {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 300px;

            background: #09090b;
            color: #fff;

            border: 1px solid #3f3f46;
            border-radius: 4px;

            padding: 15px;

            font-family: 'Unkempt', cursive;
            font-size: 17px;
            line-height: 1.7;

            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea::placeholder {
            color: #71717a;
        }

        /* =========================
           WORD BANK
        ========================= */

        .word-bank {
            background: #202026;
            padding: 18px;

            border-radius: 4px;
            border: 1px dashed #52525b;
        }

        .word-bank strong {
            color: #E4C878;
            font-size: 18px;
        }

        .word-bank p {
            margin: 8px 0;
        }

        #palette-container {
            margin-top: 12px;
        }

        .word-tag {
            display: inline-block;

            background: #2d2d39;
            color: #cbd5e1;

            padding: 5px 10px;
            margin: 4px;

            font-size: 15px;
            border-radius: 3px;
        }

        #prompt-reminder {
            color: #a1a1aa;
            font-style: italic;
            margin-bottom: 12px;
        }

        /* =========================
           RESTART BUTTON
        ========================= */

        .restart-btn {
            display: inline-block;

            background: transparent;
            color: #E4C878;

            border: 1px solid #52525b;
            border-radius: 4px;

            padding: 10px 16px;
            margin-top: 20px;

            font-family: 'Unkempt', cursive;
            font-size: 16px;

            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .restart-btn:hover {
            background-color: #2d2d39;
        }

        /* =========================
           MOBILE LAYOUT
        ========================= */

        @media (max-width: 650px) {
            body {
                padding: 12px 12px 30px;
            }

            .first {
                flex-direction: column;
                justify-content: center;
                padding: 15px;
                gap: 12px;
            }

            .logo {
                margin: 0;
            }

            .first ul {
                justify-content: center;
                gap: 10px 16px;
                margin: 0;
            }

            .first a {
                font-size: 16px;
            }

            .container {
                padding: 24px 18px;
            }

            textarea {
                min-height: 250px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVIGATION BAR
    ========================= -->

    <nav class="first" aria-label="Main navigation">

        <a href="index.html" aria-label="Home">
            <img
                src="https://github.com/JulianKeith/Poetryfilesforthetaking/blob/main/Screenshot%202026-10-15%2007.39.04.png?raw=true"
                alt="Poetry website logo"
                class="logo"
            >
        </a>

        <ul>
            <li><a href="index.html">Introduction</a></li>
            <li><a href="albums.html">Minor Chapbooks</a></li>
            <li><a href="poems.html">Poems</a></li>

            <li><a href="majorchapbooks.html">Major Chapbooks</a></li>
        </ul>

    </nav>

    <!-- =========================
         MAIN APPLICATION
    ========================= -->

    <main class="container">

        <!-- SCREEN 1: CHOICE GAME -->

        <section id="game-screen" class="screen active">

            <h2 id="question-text" aria-live="polite">
                Loading prompt...
            </h2>

            <div id="choices-container"></div>

        </section>

        <!-- SCREEN 2: WRITING WORKSPACE -->

        <section id="canvas-screen" class="screen">

            <h1>Your Free Verse Workspace</h1>

            <div class="workspace">

                <div class="word-bank">

                    <strong>Inspired Palette</strong>

                    <p>
                        Incorporate these textures into your lines.
                    </p>

                    <p>
                        Don't like your choices? Restart to explore
                        another setting.
                    </p>

                    <div
                        id="palette-container"
                        aria-label="Suggested words"
                    ></div>

                </div>

                <div>

                    <p id="prompt-reminder"></p>

                    <label for="poem-text">
                        Your poem
                    </label>

                    <textarea
                        id="poem-text"
                        placeholder="Begin spilling your words here... No rules, no rhyme constraints."
                        spellcheck="true"
                    ></textarea>

                </div>

            </div>

            <button
                type="button"
                class="restart-btn"
                id="restart-btn"
            >
                ↻ Restart and choose again
            </button>

        </section>

    </main>

    <script>
        /* =========================
           1. GAME DATA
        ========================= */

        const gameData = {
            start: {
                question: "Where is this poem breathing?",

                choices: [
                    {
                        text: "Under concrete, neon, and heavy city rain.",
                        next: "city"
                    },
                    {
                        text: "Basking in the shade of a tree.",
                        next: "nature"
                    },
                    {
                        text: "Unbeknownst to all, floating in the space of time and hours.",
                        next: "time"
                    }
                ]
            },
            time: {
                question: "What time is it?",

                choices: [
                    { 
                        text: "Dawn, orange sky and clouds peeking from the horizon.",
                        next: "dawn",
                    },
                    {   text: "Daytime, the blue sky and yellow sun smiling down to us all.",
                        next: 'day',
                    },

                    { text: 'Dusk, the orange sky barely visible as the black night sets in.',
                      next: 'dusk'
                    },
                    { text: 'Night, the velvet sky embraces the word, its black starry cloak suffocating.',
                      next: 'night'
                    },               
                ]
            },
            city: {
                question: "What breaks the midnight quiet?",

                choices: [
                    {
                        text: "The persistent, static hum of a neon sign.",

                        keywords: [
                            "neon",
                            "flicker",
                            "buzz",
                            "asphalt",
                            "shatter",
                            "electric"
                        ],

                        summary:
                            "A city landscape humming with electricity."
                    },
                    {
                        text: "A distant, wailing siren passing blocks away.",
                        

                        keywords: [
                            "wail",
                            "echo",
                            "midnight",
                            "velocity",
                            "streak",
                            "iron"
                        ],

                        summary:
                            "A restless city corner bleeding sound."
                    }
                ]
            },

            nature: {
                question: "What colour are the leaves?",

                choices: [
                    {
                        text: "Blossoming pink, cherry trees that sing to all.",
                        next: 'spring',
                        },
                        {
                        text: "Every shade of green under the sun, dozens of dozens.",
                        next: 'summer',
                        },
                        {
                        text: "Orange and gold, falling like minutes in time.",
                        next: 'fall',
                        },
                        {
                        text: "Branches bare, brown oak that longs for leaves.",
                        next: 'winter',

        
                    },
                    {
                        text: "Thin, pale beams of fractured winter sunlight.",

                        keywords: [
                            "brittle",
                            "dust",
                            "glass",
                            "gilded",
                            "shaft",
                            "cold"
                        ],

                        summary:
                            "A cold, quiet sanctuary trapped in glass."
                    }
                ]
            },
            dusk: {
                question: 'What shades are the sky?',

                choices: [
                    {
                        text: "Shades of blue slowly fading to black, the darkness overwhelming.",

                        keywords: [
                            "blue",
                            "black",
                            "dusk",
                            'clouds',
                            'skies',
                            'peeking',
                            'gazing',
                            'horizon'
                        ],
                        summary: 'a dusky time that fades into the intoxicating night.'
                    },
                    { 
                        text: 'Shades of blue melting into a orange red, the sun waning down.',

                        keywords: [
                            'orange',
                            'gazing',
                            'melt',
                            'blue',
                            'clouds',
                            'horizon',
                            'dusk',
                            'waning'
                        ],
                        summary: 'A young dusk, the orange horizon beautiful, the view shades of gold.'
                    }
                   
                ]
            },
            night: {
                question: "What can you see gazing up?",

                choices: [
                    {
                        text: "A silver moon, beckoning with its silver light.",

                        keywords: [
                            "silver",
                            "crescent",
                            "moon",
                            "breathtaking",
                            "gazing",
                            "awestruck"
                        ],

                        summary:
                            "A quiet night sky that holds on to peace."
                    },
                    {
                        text: "Stars, hundreds, millions, twinkling shyly.",

                        keywords: [
                            "twinkle",
                            "stars",
                            "starstruck",
                            "gazing",
                            "silver",
                            "breathtaking"
                        ],

                        summary:
                            "A silent night brimming with stars."
                    }
                ]
            },

            day: {
                question: "What can you see looking up?",

                choices: [
                    {
                        text: "A bright yellow sun, smiling down.",

                        keywords: [
                            "bright",
                            "yellow",
                            "sunny",
                            "blue",
                            "peaceful",
                            "awestruck"
                        ],

                        summary:
                            "A sunlit day filled with warmth and peace."
                    },
                    {
                        text: "Clouds, blanketing everything like sheets.",

                        keywords: [
                            "sheets",
                            "rain",
                            "lightning",
                            "pouring",
                            "grey",
                            "fog"
                        ],

                        summary:
                            "A cloudy day shrouded in fog, rain, and lightning."
                    }
                ]
            },
            spring: {
                question: "What colour is the sky?",

                choices: [
                    {
                        text: "A sky of blue, with flowers of pink barely visible.",

                        keywords: [
                            "cherry blossom",
                            "pink",
                            "sunny",
                            "flower",
                            "blue",
                            "day"
                        ],

                        summary:
                            "A spring day, life blossoming like buds."
                    },
                    {
                        text: "Rain, pouring in sheets, and sheets, and sheets.",

                        keywords: [
                            "sheets",
                            "rain",
                            "lightning",
                            "pouring",
                            "grey",
                            "fog"
                        ],

                        summary:
                            "A spring day shrouded in fog, rain, and lightning."
                    }
                ]
            },
            summer: {
                question: "How hot do you feel?",

                choices: [
                    {
                        text: "A mild sweat drop runs across my back, but a spoonful of ice cream soothes me.",

                        keywords: [
                            "beach",
                            "ice cream",
                            "sunny",
                            "blue",
                            "peaceful",
                            "sweat"
                        ],

                        summary:
                            "A summer beach day filled with warmth and peace."
                    },
                    {
                        text: "Overheating in the desert, with no water in sight..",

                        keywords: [
                            "desert",
                            "sand",
                            "sun",
                            "hot",
                            "barren",
                            "throat"
                        ],

                        summary:
                            "A desert, the day spent asking for help and for water."
                    }
                ]
            },
            fall: {
                question: "How fast do the leaves fall?",

                choices: [
                    {
                        text: "Too fast to catch up with.",

                        keywords: [
                            "nostalgia",
                            "longing",
                            "gold",
                            "orange",
                            "distance",
                            "time"
                        ],

                        summary:
                            "An autumn day that makes you think of better times."
                    },
                    {
                        text: "Slow, it takes its time to fall, gliding in the air.",

                        keywords: [
                            "leaves",
                            "orange",
                            "content",
                            "gold",
                            "present",
                            "tree"
                        ],

                        summary:
                            "An autumn day which makes you content by watching the leaves."
                    }
                ]
            },
            winter: {
                question: "What is the weather like today?",

                choices: [
                    {
                        text: "A drifting snowflake catches the corner of your eye.",

                        keywords: [
                            "calm",
                            "icy",
                            "snow",
                            "blue",
                            "icicle",
                            "snowflake"
                        ],

                        summary:
                            "A rare snow day that beckons peace."
                    },
                    {
                        text: "A blizzard, icy white snow with no hope of getting out.",

                        keywords: [
                            "bleak",
                            "sleet",
                            "snow",
                            "pouring",
                            "rain",
                            "white"
                        ],

                        summary:
                            "A terrifying winter day."
                    }
                ]
                
            },
            dawn: {
                question: "How orange is the sky now?",

                choices: [
                    {
                        text: "Black still envelops all, the morning is still young.",

                        keywords: [
                            "early",
                            "vivid",
                            "dark",
                            "envelop",
                            "monotone",
                            "dawn"
                        ],

                        summary:
                            "An early dark dawn, still too early to see anything."
                    },
                    {
                        text: "The sun  glows, peeking out with the horizon, birds calling from the trees.",
                        keywords: [
                            "sun",
                            "calling",
                            "orange",
                            "trees",
                            "tweet",
                            "horizon"
                        ],

                        summary:
                            "A late dawn, the birds waking up from the trees."
                    }
                ]
                
            },
        };


        /* =========================
           2. APPLICATION STATE
        ========================= */

        let currentStep = "start";
        let gatheredKeywords = [];
        let chosenSummary = "";


        /* =========================
           3. RENDER CHOICES
        ========================= */

        function renderStep() {
            const step = gameData[currentStep];

            if (!step) {
                console.error("Unknown game step:", currentStep);
                return;
            }

            const questionText =
                document.getElementById("question-text");

            const choicesContainer =
                document.getElementById("choices-container");

            questionText.textContent = step.question;

            // Remove previous choices.
            choicesContainer.replaceChildren();

            // Create the buttons for this step.
            step.choices.forEach(choice => {
                const button = document.createElement("button");

                button.type = "button";
                button.className = "choice-btn";
                button.textContent = choice.text;

                button.addEventListener("click", () => {
                    if (choice.next) {
                        // Continue through the branching game.
                        currentStep = choice.next;
                        renderStep();
                    } else {
                        // A final choice has been made.
                        gatheredKeywords = [...choice.keywords];
                        chosenSummary = choice.summary;

                        switchToCanvas();
                    }
                });

                choicesContainer.appendChild(button);
            });
        }


        /* =========================
           4. SHOW WRITING WORKSPACE
        ========================= */

        function switchToCanvas() {
            document
                .getElementById("game-screen")
                .classList.remove("active");

            document
                .getElementById("canvas-screen")
                .classList.add("active");

            // Display the selected setting.
            document
                .getElementById("prompt-reminder")
                .textContent = `Setting: ${chosenSummary}`;

            // Clear any old word suggestions.
            const palette =
                document.getElementById("palette-container");

            palette.replaceChildren();

            // Add the new word suggestions.
            gatheredKeywords.forEach(word => {
                const span = document.createElement("span");

                span.className = "word-tag";
                span.textContent = word;

                palette.appendChild(span);
            });

            // Move focus to the new screen heading.
            document
                .querySelector("#canvas-screen h1")
                .focus({ preventScroll: true });

            document
                .querySelector("#canvas-screen h1")
                .setAttribute("tabindex", "-1");
        }


        /* =========================
           5. RESTART THE ENGINE
        ========================= */

        function restartGame() {
            currentStep = "start";
            gatheredKeywords = [];
            chosenSummary = "";

            // Clear the previous poem.
            document.getElementById("poem-text").value = "";

            // Clear the previous suggestions.
            document
                .getElementById("palette-container")
                .replaceChildren();

            document
                .getElementById("prompt-reminder")
                .textContent = "";

            // Return to the first screen.
            document
                .getElementById("canvas-screen")
                .classList.remove("active");

            document
                .getElementById("game-screen")
                .classList.add("active");

            renderStep();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }


        /* =========================
           6. INITIALIZE APPLICATION
        ========================= */

        document
            .getElementById("restart-btn")
            .addEventListener("click", restartGame);

        renderStep();
    </script>
</body>
</html>
